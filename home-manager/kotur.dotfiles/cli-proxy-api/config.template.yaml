host: "127.0.0.1"
port: 8317

tls:
  enable: false
  cert: ""
  key: ""

remote-management:
  allow-remote: false
  secret-key: ""
  disable-control-panel: true
  disable-auto-update-panel: true

auth-dir: "/home/kotur/.local/share/claude-multi/auth"
api-keys:
  - "__CLAUDE_MULTI_API_KEY__"

debug: false
pprof:
  enable: false
  addr: "127.0.0.1:8316"
plugins:
  enabled: false
  dir: ""
  configs: {}
commercial-mode: true
logging-to-file: false
usage-statistics-enabled: false
proxy-url: ""
passthrough-headers: false

request-retry: 0
max-retry-credentials: 1
max-retry-interval: 0
disable-cooling: true
save-cooldown-status: false
quota-exceeded:
  switch-project: false
  switch-preview-model: false
  antigravity-credits: false

routing:
  strategy: "fill-first"
  session-affinity: true
  session-affinity-ttl: "24h"

ws-auth: true

oauth-model-alias:
  claude:
    - name: "claude-fable-5"
      alias: "claude-multi-fable-5"
      fork: true
      force-mapping: true
    - name: "claude-opus-4-8"
      alias: "claude-multi-opus-4-8"
      fork: true
      force-mapping: true
  codex:
    - name: "gpt-5.6-sol"
      alias: "claude-multi-sol-high"
      force-mapping: true
    - name: "gpt-5.6-sol"
      alias: "gpt-multi-sol-high"
      force-mapping: true
    - name: "gpt-5.6-sol"
      alias: "claude-multi-sol-xhigh"
      force-mapping: true
    - name: "gpt-5.6-sol"
      alias: "gpt-multi-sol-xhigh"
      force-mapping: true
    - name: "gpt-5.5"
      alias: "claude-multi-gpt55-high"
      force-mapping: true
    - name: "gpt-5.5"
      alias: "gpt-multi-gpt55-high"
      force-mapping: true

claude-api-key:
  - api-key: "__KIMI_CLAUDE_API_KEY__"
    base-url: "https://api.kimi.com/coding"
    auth-header: "x-api-key"
    cloak:
      mode: "never"
    models:
      - name: "k3"
        alias: "claude-multi-kimi-k3"
        display-name: "Kimi K3 1M"
        owned-by: "moonshot"
        context-length: 1048576
        force-mapping: true

payload:
  override:
    - models:
        - name: "claude-multi-sol-high"
          protocol: "codex"
        - name: "gpt-multi-sol-high"
          protocol: "codex"
      params:
        "reasoning.effort": "high"
    - models:
        - name: "claude-multi-sol-xhigh"
          protocol: "codex"
        - name: "gpt-multi-sol-xhigh"
          protocol: "codex"
      params:
        "reasoning.effort": "xhigh"
    - models:
        - name: "claude-multi-gpt55-high"
          protocol: "codex"
        - name: "gpt-multi-gpt55-high"
          protocol: "codex"
      params:
        "reasoning.effort": "high"
    - models:
        - name: "claude-multi-kimi-k3"
          protocol: "claude"
      params:
        "output_config.effort": "max"
  filter:
    - models:
        - name: "claude-multi-kimi-k3"
          protocol: "claude"
      params:
        - "thinking"
