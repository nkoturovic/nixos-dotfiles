host: "127.0.0.1"
port: 8317
tls:
  enable: false
  cert: ""
  key: ""
remote-management:
  allow-remote: false
  secret-key: ""
  disable-control-panel: true
  disable-auto-update-panel: true
auth-dir: "/home/test/.local/share/claude-multi/auth"
api-keys:
  - "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
debug: false
pprof:
  enable: false
  addr: "127.0.0.1:8316"
plugins:
  enabled: false
  dir: ""
  configs: {}
commercial-mode: true
logging-to-file: false
usage-statistics-enabled: false
proxy-url: ""
passthrough-headers: false
request-retry: 0
max-retry-credentials: 1
max-retry-interval: 0
disable-cooling: true
save-cooldown-status: false
quota-exceeded:
  switch-project: false
  switch-preview-model: false
  antigravity-credits: false
routing:
  strategy: "fill-first"
  session-affinity: true
  session-affinity-ttl: "24h"
ws-auth: true
oauth-model-alias:
  claude:
    - name: "claude-fable-5"
      alias: "claude-fable-5"
      force-mapping: true
      fork: true
    - name: "claude-opus-5"
      alias: "claude-opus-5"
      force-mapping: true
      fork: true
    - name: "claude-opus-4-8"
      alias: "claude-opus-4-8"
      force-mapping: true
      fork: true
    - name: "claude-opus-4-8"
      alias: "claude-multi-opus-4-8"
      force-mapping: true
      fork: true
    - name: "claude-opus-5"
      alias: "claude-multi-opus-5"
      force-mapping: true
      fork: true
  codex:
    - name: "gpt-5.5"
      alias: "gpt-multi-gpt55-high"
      force-mapping: true
      fork: false
    - name: "gpt-5.6-sol"
      alias: "gpt-multi-sol-high"
      force-mapping: true
      fork: false
    - name: "gpt-5.6-sol"
      alias: "gpt-multi-sol-xhigh"
      force-mapping: true
      fork: false
claude-api-key:
  - api-key: "dummy-kimi-key"
    base-url: "https://api.deepseek.com/anthropic"
    auth-header: "x-api-key"
    cloak:
      mode: "never"
    models:
      - name: "deepseek-v4-flash"
        alias: "claude-multi-deepseek-flash-high"
        display-name: "DeepSeek V4 Flash"
        owned-by: "deepseek"
        context-length: 1000000
        force-mapping: true
      - name: "deepseek-v4-flash"
        alias: "claude-multi-deepseek-flash-max"
        display-name: "DeepSeek V4 Flash"
        owned-by: "deepseek"
        context-length: 1000000
        force-mapping: true
  - api-key: "dummy-kimi-key"
    base-url: "https://api.kimi.com/coding"
    auth-header: "x-api-key"
    cloak:
      mode: "never"
    models:
      - name: "k3"
        alias: "claude-multi-kimi-k3"
        display-name: "Kimi K3 · 1M selector"
        owned-by: "moonshot"
        context-length: 1000000
        force-mapping: true
  - api-key: "dummy-kimi-key"
    base-url: "https://openrouter.ai/api"
    auth-header: "x-api-key"
    cloak:
      mode: "never"
    models:
      - name: "x-ai/grok-4.5"
        alias: "claude-multi-grok45"
        display-name: "Grok 4.5"
        owned-by: "x-ai"
        context-length: 500000
        force-mapping: true
  - api-key: "dummy-kimi-key"
    base-url: "https://token-plan.ap-southeast-1.maas.aliyuncs.com/apps/anthropic"
    cloak:
      mode: "never"
    models:
      - name: "glm-5.2"
        alias: "claude-multi-glm52-max"
        display-name: "GLM-5.2"
        owned-by: "alibaba"
        context-length: 1000000
        force-mapping: true
      - name: "qwen3.8-max"
        alias: "claude-multi-qwen38-max"
        display-name: "Qwen3.8 Max"
        owned-by: "alibaba"
        context-length: 983616
        force-mapping: true
payload:
  override:
    - models:
        - name: "claude-multi-deepseek-flash-high"
          protocol: "claude"
      params:
        "output_config.effort": "high"
    - models:
        - name: "claude-multi-deepseek-flash-max"
          protocol: "claude"
      params:
        "output_config.effort": "max"
    - models:
        - name: "claude-multi-kimi-k3"
          protocol: "claude"
      params:
        "output_config.effort": "max"
    - models:
        - name: "gpt-multi-gpt55-high"
          protocol: "codex"
        - name: "gpt-multi-sol-high"
          protocol: "codex"
      params:
        "reasoning.effort": "high"
    - models:
        - name: "gpt-multi-sol-xhigh"
          protocol: "codex"
      params:
        "reasoning.effort": "xhigh"
    - models:
        - name: "claude-multi-qwen38-max"
          protocol: "claude"
      params:
        reasoning_effort: "xhigh"
    - models:
        - name: "claude-multi-glm52-max"
          protocol: "claude"
      params:
        reasoning_effort: "max"
  filter:
    - models:
        - name: "claude-multi-kimi-k3"
          protocol: "claude"
      params:
        - "thinking"
